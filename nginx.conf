server {
    listen 80;
    root /usr/share/nginx/html;

    # Static export: one HTML file per route (/explore -> explore.html).
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Hashed bundles never change: cache them for a long time.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
