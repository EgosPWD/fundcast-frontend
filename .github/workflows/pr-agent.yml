name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Only a newer push to the same PR cancels a review in progress. Comment runs get their
# own group: otherwise a bot comment (whose job is skipped) cancels the real review.
concurrency:
  group: >-
    pr-agent-${{ github.event_name == 'issue_comment'
    && format('comment-{0}', github.run_id)
    || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PR Agent
        uses: The-PR-Agent/pr-agent@v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: https://opencode.ai/inference/go/openai/v1
          CONFIG__MODEL: openai/deepseek-v4.1-flash
          CONFIG__FALLBACK_MODELS: "[]"
          # The model is not in PR-Agent's/LiteLLM's tables: give it an input-token budget.
          # Conservative assumption (not verified against opencode); raise it if the model allows more.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "64000"
          OPENAI_CUSTOM_HEADERS: |-
            x-opencode-session: pr-agent-${{ github.repository_id }}
            User-Agent: pr-agent-action/0.50
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.handle_push_trigger: "true"
